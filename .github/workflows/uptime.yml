# Production uptime check. When it fails, GitHub emails the repo owner
# ("Run failed") and the Actions tab shows which check broke.
name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend /health (Render)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 https://vamo-699h.onrender.com/health || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then exit 0; fi
            sleep 20
          done
          echo "::error::Backend /health failed 3 times in a row"
          exit 1
      - name: Itineraries API (Render + Supabase)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vamo-699h.onrender.com/api/itineraries || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::/api/itineraries returned $code"; exit 1; }
      - name: App (Vercel)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vamo-ten.vercel.app/ || true)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::App returned $code"; exit 1; }
