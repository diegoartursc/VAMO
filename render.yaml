services:
  - type: web
    runtime: node
    name: vamo-backend
    rootDir: apps/backend
    # O backend importa @vamo/shared (packages/shared, workspace do
    # monorepo). `npm ci` isolado dentro de apps/backend nunca resolve esse
    # pacote (não é um projeto standalone) — precisa instalar a partir da
    # raiz do monorepo pra hoistear os workspaces, igual ao ambiente local.
    buildCommand: cd ../.. && npm ci && cd apps/backend && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    # `node dist/index.js` não consegue fazer require() de @vamo/shared em
    # runtime puro (o pacote é distribuído como .ts fonte, sem etapa de
    # build própria — assim ele funciona tanto no mobile/Metro quanto no
    # backend sem duplicar build). `tsx` já é devDependency do backend e é
    # exatamente o mesmo runtime usado em dev (`npm run dev`) a sessão
    # inteira — troca o executor sem mudar nenhum código.
    startCommand: npx tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_SEED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_DEMO_PURCHASES
        value: "false"
