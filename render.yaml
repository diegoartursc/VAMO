# ATENÇÃO: o serviço do Render ("VAMO", srv-d8grk07lk1mc73f81f2g) foi criado pelo
# painel, NÃO por Blueprint — este arquivo NÃO é aplicado automaticamente. A
# fonte da verdade é o painel (Settings); aqui é um espelho dele, verificado em
# 2026-09-24. Mudou algo no painel? Atualize aqui também.
services:
  - type: web
    runtime: node
    name: vamo-backend
    plan: starter  # 0.5c-512mb, desde 2026-09-24 (o free bloqueia SMTP e dorme sem uso)
    branch: main
    rootDir: apps/backend
    # O `npm install` dentro de apps/backend enxerga os workspaces da raiz e
    # resolve @vamo/shared (dependência `file:../../packages/shared`). Dev
    # dependencies entram porque o runtime usa `tsx` e as migrations usam o
    # CLI `prisma`.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Migrations automáticas: `npm run start` roda `prisma migrate deploy` ANTES
    # de subir o servidor (ver "start" em apps/backend/package.json). Se a
    # migration falhar, o processo sai com erro, a porta nunca abre, o deploy
    # falha e o Render mantém a versão anterior no ar.
    # Não usamos preDeployCommand: foi configurado quando o serviço era free
    # (onde ele não existe). No Starter ele está disponível; se mover para lá,
    # tirar a migration do "start" para não rodar duas vezes.
    #
    # Runtime `tsx` (não `node dist/index.js`): @vamo/shared é distribuído como
    # .ts fonte, sem build próprio, e `node` puro não consegue fazer require()
    # dele.
    startCommand: npm run start
    # healthCheckPath: vazio no painel. Recomendado configurar /health.
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_SEED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_DEMO_PURCHASES
        value: "false"
