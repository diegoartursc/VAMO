services:
  - type: web
    runtime: node
    name: vamo-backend
    rootDir: apps/backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_SEED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_DEMO_PURCHASES
        value: "false"
